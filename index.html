
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff1f2" />
  <title>One question for you 💌</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #fff1f2, #ffe4e6, #fce7f3);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
    }

    .card {
      width: min(100%, 540px);
      padding: 48px 24px 28px;
      text-align: center;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 30px;
      box-shadow: 0 18px 65px rgba(190,40,85,.13);
      position: relative;
      overflow: hidden;
    }

    .heart {
      font-size: 52px;
      margin-bottom: 20px;
      animation: heartbeat 2s infinite;
    }

    h1 {
      font-size: clamp(26px, 6vw, 39px);
      line-height: 1.3;
      color: #a82951;
      margin: 0;
      letter-spacing: -.8px;
    }

    .buttons {
      position: relative;
      width: min(100%, 440px);
      height: 220px;
      margin: 28px auto 0;
    }

    button {
      position: absolute;
      top: 35%;
      width: clamp(105px, 32vw, 130px);
      height: 54px;
      border: 0;
      border-radius: 999px;
      font-size: 19px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    #yes {
      left: 5%;
      background: #25b779;
      color: white;
      transition: transform .2s, box-shadow .2s;
    }

    #yes:hover {
      transform: scale(1.09);
      box-shadow: 0 8px 22px rgba(37,183,121,.3);
    }

    #no {
      left: 60%;
      background: #f9bfd0;
      color: #9c2850;
      transition: left .17s ease-out, top .17s ease-out;
    }

    .success {
      display: none;
      color: #b83255;
      font-size: clamp(20px, 5vw, 27px);
      margin: 24px 0 0;
      line-height: 1.5;
    }

    .accepted .buttons { display: none; }
    .accepted .success { display: block; }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      pointer-events: none;
      z-index: 999;
      animation: fall var(--duration) linear forwards;
    }

    @keyframes fall {
      to {
        transform: translate(
          var(--drift),
          110vh
        ) rotate(900deg);
        opacity: 0;
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.13); }
    }

    @media (max-width: 480px) {
      .card { padding: 40px 18px 20px; }
      .buttons { height: 250px; }
      button { height: 51px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none; }
      button { transition: none !important; }
    }
  </style>
</head>

<body>
  <main class="card" id="card">
    <div class="heart">💌</div>
    <h1 id="question">
      Can I take you out on a dinner?
    </h1>

    <div class="buttons" id="area">
      <button id="yes" type="button">Yes 💕</button>
      <button id="no" type="button">No 🙈</button>
    </div>

    <p class="success">
      YAY! IT'S A DATE! 💖<br>
      Now we just need to pick a restaurant 🥂
    </p>
  </main>

  <script>
    const no = document.getElementById("no");
    const yes = document.getElementById("yes");
    const area = document.getElementById("area");
    const card = document.getElementById("card");
    const question = document.getElementById("question");

    function escapeNo() {
      const maxX = area.clientWidth - no.offsetWidth;
      const maxY = area.clientHeight - no.offsetHeight;

      const yesRect = yes.getBoundingClientRect();
      const areaRect = area.getBoundingClientRect();

      const yesX = yesRect.left - areaRect.left;
      const yesY = yesRect.top - areaRect.top;

      const oldX = no.offsetLeft;
      const oldY = no.offsetTop;

      let x = oldX;
      let y = oldY;

      for (let i = 0; i < 100; i++) {
        const testX = Math.random() * maxX;
        const testY = Math.random() * maxY;

        const overlapsYes =
          testX < yesX + yes.offsetWidth + 15 &&
          testX + no.offsetWidth + 15 > yesX &&
          testY < yesY + yes.offsetHeight + 15 &&
          testY + no.offsetHeight + 15 > yesY;

        const tooClose =
          Math.hypot(testX - oldX, testY - oldY) < 85;

        if (!overlapsYes && !tooClose) {
          x = testX;
          y = testY;
          break;
        }
      }

      no.style.left = x + "px";
      no.style.top = y + "px";
    }

    // Desktop: escape when the mouse approaches.
    no.addEventListener("pointerenter", event => {
      if (event.pointerType !== "touch") escapeNo();
    });

    // Phones and tablets: escape when tapped.
    no.addEventListener("pointerdown", event => {
      event.preventDefault();
      escapeNo();
    });

    // Keyboard navigation.
    no.addEventListener("focus", escapeNo);

    // Extra protection against accidental clicks.
    no.addEventListener("click", event => {
      event.preventDefault();
      escapeNo();
    });

    yes.addEventListener("click", () => {
      card.classList.add("accepted");
      question.textContent = "Best decision ever! 💗";
      launchConfetti();
    });

    function launchConfetti() {
      const colors = [
        "#ff4d87", "#ffbd59", "#25b779",
        "#a78bfa", "#fb7185", "#60a5fa"
      ];

      for (let i = 0; i < 120; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background =
          colors[Math.floor(Math.random() * colors.length)];
        piece.style.setProperty(
          "--duration", (2.5 + Math.random() * 2) + "s"
        );
        piece.style.setProperty(
          "--drift", (Math.random() * 250 - 125) + "px"
        );
        piece.style.animationDelay =
          Math.random() * 0.8 + "s";

        document.body.appendChild(piece);
        piece.addEventListener("animationend", () => piece.remove());
      }
    }
  </script>
</body>
</html>
