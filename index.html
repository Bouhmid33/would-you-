
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f2">
  <title>A question for you 💌</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(
        135deg, #fff1f2, #ffe4e6, #fce7f3
      );
      font-family: "Segoe UI", Arial, sans-serif;
      color: #a82951;
    }

    .card {
      width: min(100%, 540px);
      padding: 36px 22px;
      border-radius: 30px;
      text-align: center;
      background: rgba(255,255,255,.9);
      box-shadow: 0 18px 65px rgba(190,40,85,.13);
      border: 1px solid rgba(255,255,255,.9);
    }

    [hidden] { display: none !important; }

    h1 {
      margin: 15px 0;
      font-size: clamp(27px, 6vw, 39px);
      line-height: 1.3;
      letter-spacing: -.7px;
    }

    h2 {
      font-size: clamp(24px, 5vw, 31px);
      margin: 10px 0;
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 2s infinite;
    }

    .buttons {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 220px;
      margin: 30px auto 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .choice {
      position: absolute;
      top: 30%;
      width: 105px;
      height: 52px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      user-select: none;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    #yes {
      left: 5%;
      background: #25b779;
      color: white;
      transition: transform .2s;
    }

    #yes:hover { transform: scale(1.08); }

    #no {
      left: 55%;
      background: #f9bfd0;
      color: #9c2850;
      transition: left .16s, top .16s;
    }

    .hint {
      color: #b97891;
      font-size: 13px;
      margin-top: 10px;
    }

    .message {
      font-size: 16px;
      line-height: 1.7;
      color: #96516a;
      margin: 20px auto 24px;
      max-width: 420px;
    }

    .calendar {
      background: #fff8fa;
      border: 1px solid #f7d4df;
      border-radius: 22px;
      padding: 16px;
      margin-top: 15px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    #monthLabel {
      font-size: 17px;
      font-weight: 700;
    }

    .nav {
      border: none;
      background: #ffe1e9;
      color: #a82951;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 22px;
    }

    .nav:disabled {
      opacity: .3;
      cursor: default;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday {
      font-size: 12px;
      font-weight: 700;
      color: #b87990;
      padding: 8px 0;
    }

    .day {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #d6b5bf;
      font-size: 14px;
      font-weight: 600;
      padding: 0;
      position: relative;
    }

    .day:disabled { cursor: default; }

    .day.available {
      background: #ffe0e9;
      color: #a82951;
    }

    .day.available:hover {
      background: #f8bbce;
    }

    .day.selected {
      background: #b83255;
      color: white;
      box-shadow: 0 4px 12px rgba(184,50,85,.25);
    }

    .day.available::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: currentColor;
      border-radius: 50%;
    }

    .selection {
      background: #fff1f5;
      color: #a82951;
      padding: 15px 12px;
      border-radius: 15px;
      margin-top: 20px;
      font-size: 15px;
      line-height: 1.5;
    }

    .main-button {
      display: block;
      width: 100%;
      border: none;
      margin-top: 15px;
      padding: 16px;
      border-radius: 30px;
      color: white;
      background: #b83255;
      font-size: 16px;
      font-weight: bold;
    }

    .main-button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .back {
      margin-top: 20px;
      border: none;
      background: none;
      color: #ac7286;
      text-decoration: underline;
      font-size: 13px;
    }

    .status {
      color: #a82951;
      font-size: 14px;
      margin-top: 12px;
    }

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 16px;
      pointer-events: none;
      z-index: 999;
      animation: fall var(--duration) linear forwards;
    }

    @keyframes fall {
      to {
        transform: translate(var(--drift),110vh)
          rotate(900deg);
        opacity: 0;
      }
    }

    @keyframes heartbeat {
      50% { transform: scale(1.12); }
    }

    @media(max-width:480px) {
      body { padding: 14px; }
      .card { padding: 30px 18px; }
      .buttons { height: 210px; }
      .calendar { padding: 10px; }
      .calendar-grid { gap: 3px; }
    }

    @media(prefers-reduced-motion:reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

<main class="card">

  <!-- STEP 1: THE QUESTION -->

  <section id="questionScreen">
    <div class="heart">💌</div>

    <h1>Can I take you out for dinner?</h1>

    <div class="buttons" id="buttonArea">
      <button id="yes" class="choice">Yes 💕</button>
      <button id="no" class="choice">No 🙈</button>
    </div>

    <p class="hint">The No button seems a little shy...</p>
  </section>

  <!-- STEP 2: CALENDAR -->

  <section id="calendarScreen" hidden>

    <div class="heart">🥂</div>

    <h2>I knew you wouldn't say no! It's a date! 💖</h2>

    <p class="message" id="availabilityMessage"></p>

    <div class="calendar">
      <div class="calendar-header">
        <button class="nav" id="prevMonth"
                aria-label="Previous month">‹</button>
        <span id="monthLabel"></span>
        <button class="nav" id="nextMonth"
                aria-label="Next month">›</button>
      </div>

      <div class="calendar-grid" id="calendarGrid">
        <span class="weekday">Mon</span>
        <span class="weekday">Tue</span>
        <span class="weekday">Wed</span>
        <span class="weekday">Thu</span>
        <span class="weekday">Fri</span>
        <span class="weekday">Sat</span>
        <span class="weekday">Sun</span>
      </div>
    </div>

    <div class="selection" id="selectionText"
         aria-live="polite">
      💕 Tap a highlighted date to choose it.
    </div>

    <button class="main-button" id="shareButton" disabled>
      Share my choice 💌
    </button>

    <p class="status" id="shareStatus"
       role="status"></p>

    <button class="back" id="backButton">
      ← Back to the question
    </button>

  </section>

</main>

<script>

  // ==========================================
  // 💌 CONFIGURATION — EDIT THIS EVERY TIME
  // ==========================================

  const CONFIG = {

    // The message she sees after clicking YES.
    // {dates} is replaced automatically.

    message:
      "I can make myself available for you on {dates}. " +
      "Which one works best for you? 💕",

    // Your available dinner dates.
    // Format: YYYY-MM-DD
    // Change these dates and times as needed.

    availableDates: [
      { date: "2026-11-24", time: "7:30 PM" },
      { date: "2026-11-27", time: "8:00 PM" },
      { date: "2026-12-01", time: "7:00 PM" }
    ]

  };

  // ==========================================
  // END OF CONFIGURATION
  // ==========================================

  const $ = id => document.getElementById(id);

  const yes = $("yes");
  const no = $("no");
  const area = $("buttonArea");

  const questionScreen = $("questionScreen");
  const calendarScreen = $("calendarScreen");

  const grid = $("calendarGrid");
  const monthLabel = $("monthLabel");
  const selectionText = $("selectionText");
  const shareButton = $("shareButton");
  const shareStatus = $("shareStatus");

  let selectedDate = null;
  let monthIndex = 0;

  // Keep dates local to avoid timezone shifts.

  function parseDate(iso) {
    return new Date(iso + "T12:00:00");
  }

  function formatDate(iso) {
    return new Intl.DateTimeFormat("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    }).format(parseDate(iso));
  }

  // Exclude dates that have already passed.

  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  const dates = CONFIG.availableDates
    .filter(item => item.date >= todayISO())
    .sort((a, b) => a.date.localeCompare(b.date));

  const dateMap = new Map(
    dates.map(item => [item.date, item])
  );

  // Only display months containing available dates.

  const months = [...new Set(
    dates.map(item => item.date.slice(0, 7))
  )];

  // ==========================================
  // STEP 1: RUNAWAY NO BUTTON
  // ==========================================

  function escapeNo() {
    const maxX = Math.max(
      0, area.clientWidth - no.offsetWidth
    );

    const maxY = Math.max(
      0, area.clientHeight - no.offsetHeight
    );

    let x = no.offsetLeft;
    let y = no.offsetTop;

    for (let i = 0; i < 100; i++) {
      const testX = Math.random() * maxX;
      const testY = Math.random() * maxY;

      // Prevent overlap with YES.
      const overlapsYes =
        testX < yes.offsetLeft + yes.offsetWidth + 12 &&
        testX + no.offsetWidth + 12 > yes.offsetLeft &&
        testY < yes.offsetTop + yes.offsetHeight + 12 &&
        testY + no.offsetHeight + 12 > yes.offsetTop;

      const tooClose =
        Math.hypot(testX - x, testY - y) < 75;

      if (!overlapsYes && !tooClose) {
        x = testX;
        y = testY;
        break;
      }
    }

    no.style.left = x + "px";
    no.style.top = y + "px";
  }

  no.addEventListener("pointerenter", e => {
    if (e.pointerType !== "touch") escapeNo();
  });

  no.addEventListener("pointerdown", e => {
    e.preventDefault();
    escapeNo();
  });

  no.addEventListener("focus", escapeNo);

  no.addEventListener("click", e => {
    e.preventDefault();
    escapeNo();
  });

  // ==========================================
  // STEP 2: YES OPENS CALENDAR
  // ==========================================

  yes.addEventListener("click", () => {
    questionScreen.hidden = true;
    calendarScreen.hidden = false;

    const choices = dates.map(item =>
      formatDate(item.date) +
      (item.time ? " at " + item.time : "")
    );

    const formattedList = new Intl.ListFormat(
      "en-US",
      { style: "long", type: "disjunction" }
    ).format(choices);

    $("availabilityMessage").textContent =
      dates.length
        ? CONFIG.message.replace("{dates}", formattedList)
        : "I haven't added my available dates yet. 💕";

    renderCalendar();
    launchConfetti();
  });

  // ==========================================
  // CALENDAR RENDERING
  // ==========================================

  function renderCalendar() {
    grid.querySelectorAll(".day, .blank").forEach(
      element => element.remove()
    );

    if (!months.length) {
      monthLabel.textContent = "No dates available";
      $("prevMonth").disabled = true;
      $("nextMonth").disabled = true;
      return;
    }

    const [year, month] =
      months[monthIndex].split("-").map(Number);

    const firstDay = new Date(year, month - 1, 1);
    const daysInMonth = new Date(year, month, 0)
      .getDate();

    monthLabel.textContent =
      new Intl.DateTimeFormat("en-US", {
        month: "long",
        year: "numeric"
      }).format(firstDay);

    $("prevMonth").disabled = monthIndex === 0;
    $("nextMonth").disabled =
      monthIndex === months.length - 1;

    // Monday-first calendar.
    const offset = (firstDay.getDay() + 6) % 7;

    for (let i = 0; i < offset; i++) {
      const blank = document.createElement("span");
      blank.className = "blank";
      grid.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey =
        `${year}-${String(month).padStart(2, "0")}-` +
        String(day).padStart(2, "0");

      const option = dateMap.get(dateKey);

      const button = document.createElement("button");
      button.className = "day";
      button.type = "button";
      button.textContent = day;

      if (option) {
        button.classList.add("available");
        button.setAttribute(
          "aria-label",
          formatDate(dateKey) +
          (option.time ? " at " + option.time : "")
        );

        if (selectedDate?.date === dateKey) {
          button.classList.add("selected");
          button.setAttribute("aria-pressed", "true");
        } else {
          button.setAttribute("aria-pressed", "false");
        }

        button.addEventListener("click", () => {
          selectedDate = option;

          selectionText.textContent =
            "💕 " + formatDate(option.date) +
            (option.time ? " at " + option.time : "");

          shareButton.disabled = false;
          shareStatus.textContent = "";

          renderCalendar();
        });
      } else {
        button.disabled = true;
      }

      grid.appendChild(button);
    }
  }

  $("prevMonth").addEventListener("click", () => {
    if (monthIndex > 0) {
      monthIndex--;
      renderCalendar();
    }
  });

  $("nextMonth").addEventListener("click", () => {
    if (monthIndex < months.length - 1) {
      monthIndex++;
      renderCalendar();
    }
  });

  // ==========================================
  // SHARE HER SELECTED DATE
  // ==========================================

  shareButton.addEventListener("click", async () => {
    if (!selectedDate) return;

    const choice =
      formatDate(selectedDate.date) +
      (selectedDate.time
        ? " at " + selectedDate.time
        : "");

    const message =
      "Hey! 💕 " + choice +
      " works for me. Let's plan our dinner! 🥂";

    // Open the native sharing menu when supported.
    if (navigator.share) {
      try {
        await navigator.share({
          title: "Dinner date 💌",
          text: message
        });

        shareStatus.textContent =
          "💕 Thanks! Can't wait!";
        return;

      } catch (error) {
        if (error.name === "AbortError") return;
      }
    }

    // Otherwise copy the response.
    try {
      await navigator.clipboard.writeText(message);
      shareStatus.textContent =
        "💌 Copied! Paste it into our chat to send it.";
    } catch {
      window.prompt("Copy your choice:", message);
    }
  });

  $("backButton").addEventListener("click", () => {
    calendarScreen.hidden = true;
    questionScreen.hidden = false;
  });

  // ==========================================
  // CONFETTI
  // ==========================================

  function launchConfetti() {
    const colors = [
      "#ff4d87", "#ffbd59",
      "#25b779", "#a78bfa",
      "#fb7185", "#60a5fa"
    ];

    for (let i = 0; i < 100; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti";

      piece.style.left = Math.random() * 100 + "vw";

      piece.style.background =
        colors[Math.floor(Math.random() * colors.length)];

      piece.style.setProperty(
        "--duration",
        (2.5 + Math.random() * 2) + "s"
      );

      piece.style.setProperty(
        "--drift",
        (Math.random() * 250 - 125) + "px"
      );

      piece.style.animationDelay =
        Math.random() * .8 + "s";

      document.body.appendChild(piece);

      piece.addEventListener("animationend", () => {
        piece.remove();
      });
    }
  }

</script>
</body>
</html>
